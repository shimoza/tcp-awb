<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections=[['overview','Overview','grid'],['projects','Projects','folder'],['board','Board','check'],['customers','Customers','book'],['knowledge','Knowledge','book'],['prices','Prices','price'],['tenants','Test tenants','server'],['usage','API usage','clock']];
// The contracted owner routes move together. Discover availability from existing requests only.
let ownerRoutesAvailable=true;
function availableSections(){return sections.filter(([id])=>ownerRoutesAvailable||id!=='customers')}
function ownerRouteMissing(path,method='GET'){
 if(!(/^\/api\/(customers|customer-operations\/[^/]+|project-operations\/[^/]+)$/.test(path)||method==='POST'&&path==='/api/projects'||/^\/api\/projects\/[^/]+\/materials(?:[/?]|$)/.test(path)))return false;
 ownerRoutesAvailable=false;
 customersLive.items=[];customersLive.error='';
 for(const m of materialsByProject.values()){m.items=[];m.error=''}
 for(const c of conversations.values())c.materialIds=[];
 if($('#create-dialog').open)$('#create-dialog').close();
 $('#create-body').innerHTML='';
 $$('[data-new-project], [data-new-customer], [data-inline-customer], #nav a[href="#customers"], [data-jump="customers"], .detail-tabs [data-detail-tab="materials"]').forEach(el=>el.remove());
 if(state.route==='customers')$('#main').innerHTML='';
 if($('#materials-view'))$('#project-section').innerHTML='';
 if($('#chat-material-options'))$('#chat-material-options').innerHTML='';
 return true;
}
let projects=[];
const live={loaded:false,loading:false,error:'',fetched:null,detail:null};
const knowledgeLive={data:null,lastQuery:'',loading:false,error:'',status:null};
let knowledgeTimer=null,knowledgeRequest=0;
const reviews=[{id:'R-01',name:'Migration plan',project:'tcp-q7m4',status:'Changed',note:'The document changed after its last review.'},{id:'R-02',name:'Database comparison',project:'tcp-b3np',status:'Not reviewed',note:'No review has been recorded for this example document.'},{id:'R-03',name:'Network lab findings',project:'tcp-kx2a',status:'Changed',note:'The evidence section changed after its last review.'},{id:'R-04',name:'Inventory summary',project:'tcp-q7m4',status:'Reviewed',note:'The current example version matches its review record.'},{id:'R-05',name:'Network test scope',project:'tcp-kx2a',status:'Reviewed',note:'The current example version matches its review record.'},{id:'R-06',name:'Database requirements',project:'tcp-b3np',status:'Reviewed',note:'The current example version matches its review record.'}];
let tenants=[];
const priceLive={data:null,lastLookup:null,loading:false,error:'',status:null};
const state={route:'overview',projectTab:'Active',query:'',grade:'all',freshness:'all',review:'all',tenant:'test-1',service:'ecs',region:'eu-de',flavor:''};
const badge=(text,tone)=>`<span class="badge ${tone||({Active:'green',Closed:'gray',Reviewed:'green',Changed:'amber','Not reviewed':'gray',live:'green',contract:'pink',docs:'gray',said:'amber',assumed:'gray',Expired:'amber'}[text]||'gray')}">${esc(text)}</span>`;
const link=(route,text)=>`<a class="text-link" href="#${route}">${text}${icon('arrow')}</a>`;
function footer(){return `<footer class="bottom-line"><span>${icon('lock')} ${['overview','projects','project','board','customers','tenants','knowledge','prices','usage'].includes(state.route)?'Live workspace':'Sample data · Design preview'}</span><span>ARCHITECT WORKBENCH </span></footer>`}
function head(title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${state.route==='overview'?new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date()):'Architect workspace'}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`}
function projectKindLabel(kind){const label=['query','topic','engagement','code'].includes(kind)?'Query':['project','lab'].includes(kind)?'Project':kind;return esc(label)+(['topic','engagement','lab','code'].includes(kind)?` <small class="project-kind-legacy">${esc(kind)}</small>`:'')}
const projectKindLabels=new Map([['query','Query: knowledge, docs and live prices'],['project','Project: also reaches a test tenant'],['topic','Question or estimate'],['engagement','Customer work'],['lab','Lab or experiment'],['code','Development']]);
function recordedStatusList(status){if(!status)return '';const empty=status.summary===null&&status.next===null;return `<div class="recorded-status-list">${empty?'<div class="recorded-status-empty">No status recorded yet</div>':`${status.summary!==null?`<div class="recorded-status-line" title="${esc(status.summary)}">${esc(status.summary)}</div>`:''}${status.next!==null?`<div class="recorded-status-line recorded-status-next" title="${esc('Next: '+status.next)}">Next: ${esc(status.next)}</div>`:''}`}<div class="recorded-status-meta"><span>updated ${statusDateTime(status.updated)}</span>${status.behind>0?badge(status.behind+' changes since','amber'):''}</div></div>`}
function recordedStatusBlock(status){if(!status)return '';const empty=status.summary===null&&status.next===null;return `<section class="panel recorded-status-block" aria-labelledby="recorded-status-title"><h2 id="recorded-status-title">Status</h2>${empty?'<p class="recorded-status-empty">No status recorded yet. It appears once the working session writes the Status: and Next: lines of STATE.md.</p>':`${status.summary!==null?`<p>${esc(status.summary)}</p>`:''}${status.next!==null?`<h2>Next</h2><p>${esc(status.next)}</p>`:''}`}<div class="recorded-status-meta">Updated ${statusDateTime(status.updated)}</div>${status.behind>0?`<div class="notice">The recorded status may be out of date: ${esc(status.behind)} changes since ${statusDateTime(status.updated)}.</div>`:''}</section>`}
function projectRows(items){return items.map(p=>`<tr><td class="live-project-cell"><a class="row-link project-code" href="#project/${p.id}">${esc(p.id)}</a><a class="project-goal" href="#project/${p.id}" title="${esc(p.goal||'Goal unavailable')}">${esc(p.goal||'Goal unavailable')}</a>${recordedStatusList(p.status)}</td><td>${projectKindLabel(p.kind)}</td><td>${p.customer==='none'?'<span class="muted">Internal</span>':esc(p.customer)}</td><td>${badge(p.state)}</td><td>${p.open_items??'Unknown'}</td><td>${p.live_resources===null?'Unknown':p.live_resources>0?badge(p.live_resources+' live','amber'):'0'}</td><td>${dateLabel(p.updated||p.created)}</td><td><a class="text-link" href="#project/${p.id}" aria-label="Open ${esc(p.id)}">${icon('arrow')}</a></td></tr>`).join('')}
function dateLabel(value){if(!value)return 'Unknown';return esc(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',day:'2-digit',month:'short',year:'numeric'}).format(new Date(value)))}
function statusDateTime(value){if(!value)return esc('Unknown');return esc(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'}).format(new Date(value)))}
function workbenchLock(message){return typeof message==='string'?(message.startsWith('The data check is locked')?'vault':message.startsWith('The key service is locked')?'keys':''):''}
function lockedNotice(message,retry,disabled=false,extra=''){if(!workbenchLock(message))return '';return `<div class="notice lock-notice" role="status"><p>${esc('The Workbench is locked. The owner unlocks it in his terminal.')}</p><button type="button" class="btn" ${retry} ${disabled?'disabled':''}>Try again</button>${extra}</div>`}
function projectTable(items){if(workbenchLock(live.error))return lockedNotice(live.error,'data-refresh-projects',live.loading);if(live.error)return `<div class="empty"><strong>Projects could not be loaded</strong><p>${esc(live.error)}</p><button class="btn" data-refresh-projects>Try again</button> <a class="btn" href="/login">Sign in</a></div>`;if(!live.loaded)return `<div class="empty" role="status"><strong>Loading your projects…</strong><p>Reading the AWB project register.</p></div>`;if(!items.length)return `<div class="empty"><strong>No ${state.projectTab==='Active'?'active ':''}projects</strong><p>${projects.length?'Switch to All projects to see closed work.':'No projects are currently registered.'}</p></div>`;return `<div class="table-wrap" tabindex="0" aria-label="Projects table"><table><thead><tr><th>Project / goal</th><th>Kind</th><th>Customer</th><th>Status</th><th>Open items</th><th>Resources</th><th>Updated</th><th></th></tr></thead><tbody>${projectRows(items)}</tbody></table></div>`}
function projectTabs(){return `<div class="tabs" aria-label="Project filter">${['Active','All projects'].map(t=>`<button data-project-tab="${t}" aria-pressed="${state.projectTab===t}">${t} <span style="margin-left:4px;opacity:.6">${live.loaded?(t==='Active'?projects.filter(p=>p.state==='Active').length:projects.length):'…'}</span></button>`).join('')}</div>`}
function filteredProjects(){return projects.filter(p=>state.projectTab==='All projects'||p.state===state.projectTab)}
function factRow(f){return `<div class="fact">${icon('file')}<div class="fact-main"><button class="row-link" data-fact="${esc(f.id)}">${esc(f.statement)}</button><div class="fact-meta"><span class="code">${esc(f.id)}</span><span>${esc(f.class)}</span><span>${esc('Checked '+f.checked)}</span>${f.expired?badge('Expired'):''}</div></div>${badge(f.grade)}</div>`}
function pultTime(iso){if(!iso)return '';const d=new Date(iso);return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d).replace(',','')}
function pultPlatform(pf){if(!pf)return {open:0,next:[],state:'idle',line:'TCP platform: not read yet'};const ev=pf.events||[];const open=ev.filter(e=>e.type==='incident');const next=ev.filter(e=>e.type!=='incident');const state=pf.result&&pf.result!=='ok'&&pf.result!=='none'?'bad':open.length?(open.some(e=>e.impact>=2)?'bad':'run'):'ok';return {open:open.length,next,ev,state,line:open.length?`TCP platform: ${open.length} open incident${open.length>1?'s':''}`:pf.pulled?'TCP platform: no open incident':'TCP platform: not read yet'}}
function pultBuild(line){const m=/live ([0-9a-f]{7,})/.exec(line||'');const nd=/(\d+) not deployed/.exec(line||'');return {live:m?m[1]:'',pending:nd?+nd[1]:0,line:(line||'').replace(/^build:\s*/,'')}}
function pultWaiting(data){const out=[];for(const p of (data?data.projects:[]))for(const it of p.waiting_on.items)out.push({code:p.code,text:it});return out}
function pultCap(t){return t?t[0].toUpperCase()+t.slice(1):t}
function pultWhere(text){const t=text.toLowerCase();return /terminal|sudo |awb [a-z]+ /.test(t)?'your terminal':/session/.test(t)?'project session':'here'}
function pultSummary(){const data=boardLive.data;if(!data)return null;const ps=data.projects;const sum=k=>ps.reduce((a,p)=>a+(p[k]||0),0);return {waiting:ps.reduce((a,p)=>a+p.waiting_on.total,0),active:data.summary.projects,parked:(data.parked||[]).length,open:sum('open_items'),live:sum('live_resources'),lagging:data.summary.lagging}}
function pultBoard(){const data=boardLive.data;
 if(!data){return `<section class="panel"><div class="empty" role="status"><strong>${boardLive.error?'Board unavailable':'Reading the board…'}</strong><p>${esc(boardLive.error||'The project register, the TCP platform and the build queue.')}</p>${boardLive.error?'<button class="btn" data-refresh-board>Try again</button>':''}</div></section>`}
 const pf=pultPlatform(data.platform),b=pultBuild(data.build),k=pultSummary(),w=pultWaiting(data);
 const strip=`<div class="pult-strip" role="status"><span><i class="sdot ${pf.state}"></i>${esc(pf.line)}</span><span><i class="sdot ${!b.live?'idle':b.pending?'run':'ok'}"></i>${b.live?`Live <code>${esc(b.live)}</code>`:'Build line not read'}${b.pending?` · ${b.pending} not deployed`:''}</span><span><i class="sdot ${tenants.length?'ok':'idle'}"></i>${tenantLive.registered_count??'…'} test tenants</span><span class="pult-gen">as of ${esc(pultTime(data.generated_at))}</span></div>`;

function costData(){const c=tenantLive.cost;if(!c||typeof c!=='object'||typeof c.total!=='number')return null;if(!Array.isArray(c.by_project))return c;

 const w=Object.fromEntries((c.waste||[]).map(x=>[x.group,x]));const p0=(c.prices||[])[0]||{};

  tenants:(c.tenants||[]).map(t=>({alias:t.alias,total:t.total||0,kinds:kinds[t.alias]||{},status:t.status})),

  items:rows.map(r=>({tenant:r.tenant,kind:r.kind,item:r.handle,detail:what(r).replace(/\s+/g,' ').trim(),project:r.project||'no project',monthly:typeof r.monthly==='number'?r.monthly:0,note:r.note||''})),
  waste:{stopped_disks:w.stopped_server_disks?.amount,unattached_disks:w.unattached_disks?.amount,unbound_eips:w.unbound_eips?.amount,unbound_eip_count:(w.unbound_eips?.items||[]).length},

function costHome(){const c=costData();if(!c)return '';const top=(c.items||[]).slice(0,3),waste=costWaste(c);

async function readAPI(path,{notFound,serviceError}={}){const response=await fetch(path,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(response.status===404){const unavailable=ownerRouteMissing(path);throw Object.assign(new Error(notFound||'Not found.'),{status:404,notOnSite:unavailable})}if(response.status===401)throw Object.assign(new Error('Your session has expired. Sign in again using the link below.'),{status:401});if(!response.headers.get('Content-Type')?.includes('application/json')){if(serviceError)throw Object.assign(new Error((!response.ok&&(await response.text()).trim())||serviceError),{status:response.status});throw new Error('Your session has expired. Sign in again using the link below.')}let result;try{result=await response.json()}catch(e){if(!serviceError)throw e;throw Object.assign(new Error(serviceError),{status:response.status})}if(!response.ok)throw Object.assign(new Error(result.error||serviceError||'The project service is unavailable.'),{status:response.status});return result}

async function refreshProjects(){if(live.loading)return;live.loading=true;live.error='';try{const data=await readAPI('/api/projects');projects=data.projects.map(p=>({...p,id:p.code,name:p.goal||p.code,state:p.state==='active'?'Active':'Closed',kind:p.kind}));live.loaded=true;live.fetched=data.fetched_at}catch(e){live.error=e.message;live.loaded=false}finally{live.loading=false;if(['overview','projects'].includes(state.route))render()}}
function plainDocument(doc){if(!doc||doc.status!=='available')return `<div class="empty"><strong>${doc?.status==='missing'?'No file yet':'Content unavailable'}</strong><p>This project has no readable content for this section.</p></div>`;if(doc.text.startsWith('# State of ')&&doc.text.includes('Where the work stands.')&&!doc.text.split('## Now')[1]?.split('\n').some(l=>l.trim()&&!l.startsWith('## ')))return '<div class="empty"><strong>Project created</strong><p>No work status has been recorded yet. Start with a question or continue in Claude.</p></div>';let content=doc.text.split('\n').filter(line=>!line.startsWith('# ')).map(line=>{if(line.startsWith('## '))return `<h3>${esc(line.slice(3))}</h3>`;if(line.startsWith('### '))return `<h4>${esc(line.slice(4))}</h4>`;if(line.startsWith('- '))return `<div class="document-item">${esc(line.slice(2))}</div>`;return line.trim()?`<p>${esc(line)}</p>`:''}).join('');return `${doc.redacted?'<div class="notice">Some values were withheld by the data check.</div>':''}<div class="project-document">${content||'<p>No entries recorded yet.</p>'}</div>`}
function resourceDocument(doc){if(!doc||doc.status!=='available')return plainDocument(doc);const lines=doc.text.split('\n');const table=lines.filter(l=>l.trim().startsWith('|')).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));if(table.length<2)return plainDocument(doc);const headers=table[0];const rows=table.slice(1).filter(c=>!c.every(v=>/^[-: ]*$/.test(v)));if(!rows.length)return '<div class="empty"><strong>No resources recorded</strong><p>This project has no entries in its resource register.</p></div>';return `${doc.redacted?'<div class="notice">Some resource values were withheld by the data check.</div>':''}<div class="table-wrap" tabindex="0" aria-label="Project resources"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(c=>`<tr>${c.map((v,i)=>`<td class="${i===c.length-1?'resource-note':''}">${headers[i]?.toLowerCase()==='state'?badge(v,v.toLowerCase()==='live'?'amber':'gray'):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function detailPanel(title,source,body){return `<div class="detail-panel"><div class="pult-head"><h2>${title}</h2><span><code>${source}</code></span></div>${body}</div>`}
function projectPage(){return `<div id="live-project"><div class="empty" role="status"><strong>Opening project…</strong><p>Reading the current project files.</p></div></div>`}
async function loadProject(id){const route='project/'+id;try{const p=await readAPI('/api/projects/'+encodeURIComponent(id));if(location.hash.slice(1)!==route)return;live.detail=p;showProject(p)}catch(e){if(location.hash.slice(1)!==route)return;if(workbenchLock(e.message)){$('#live-project').innerHTML=`${head(esc(id),'Project workspace')}<section class="panel">${lockedNotice(e.message,`data-refresh-project="${esc(id)}"`,false,'<a class="btn" href="#projects">Back to projects</a>')}</section>`;return}$('#live-project').innerHTML=`${head('Project unavailable',id)}<section class="panel"><div class="empty"><strong>This project could not be opened</strong><p>${esc(e.message)}</p><a class="btn" href="#projects">Back to projects</a> <a class="btn" href="/login">Sign in</a></div></section>`}}
const conversations=new Map();
let chatPoll=null;
function conversation(code){if(!conversations.has(code))conversations.set(code,{turns:[],loaded:false,loading:false,error:'',draft:'',sending:false,uncertain:false,requestId:null,budget:null});return conversations.get(code)}
function currentProject(code){return location.hash==='#project/'+code}
function chatTime(value){return value?new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(value)):''}
function chatPanel(code){const c=conversation(code);const pending=c.sending||c.turns.some(t=>t.status==='pending');const exhausted=c.budget&&(c.budget.questions_left===0||c.budget.tokens_left<4096);return `<section class="panel project-chat" aria-labelledby="chat-title"><div class="panel-head"><div><h2 id="chat-title">Ask about this project</h2><p>Claude · ${esc(code)} · Saved conversation</p></div><button class="btn chat-refresh" data-chat-refresh="${code}" aria-label="Refresh conversation" ${c.loading?'disabled':''}>${icon('clock')}</button></div><div class="chat-messages" role="log" aria-label="Project conversation">${!c.loaded?`<p class="chat-empty">${c.loading?'Loading conversation…':'Conversation not loaded.'}</p>`:!c.turns.length?'<div class="chat-empty"><strong>Pick up where you left off.</strong><p>Ask about the latest status, an open question or the next step.</p></div>':c.turns.map(t=>`<article class="chat-turn"><div class="chat-message user-message"><div class="chat-byline">You <time>${esc(chatTime(t.created))}</time></div><p>${esc(t.question)}</p></div><div class="chat-message assistant-message"><div class="chat-byline">Claude ${t.tokens?`<span>${Number(t.tokens).toLocaleString('en-GB')} tokens</span>`:''}</div>${t.status==='pending'?'<p role="status">Preparing an answer… You can leave this page and return later.</p>':t.status==='failed'?`<p class="chat-error">${esc(t.error)}</p>`:`<p>${esc(t.answer)}</p>`}${materialSources(t)}</div></article>`).join('')}${c.older_turns?'<p class="chat-help">Showing the latest 100 questions. Older history is still saved.</p>':''}</div>${!c.turns.length?`<div class="chat-suggestions"><button data-chat-suggest="What is the latest recorded status and next step?">Latest status</button><button data-chat-suggest="What is blocking this project?">Open questions</button></div>`:''}<form id="project-chat-form" data-code="${code}"><label for="project-question">Your question</label><textarea id="project-question" name="question" rows="3" maxlength="1000" placeholder="What should we do next?" required ${pending||c.uncertain?'disabled':''}>${esc(c.draft)}</textarea><p class="chat-help">Uses the current project files and recent conversation. Answers do not change the project.</p>${c.error?(lockedNotice(c.error,`data-chat-${c.errorAction==='send'?'retry-send':'refresh'}="${esc(code)}"`,c.loading||pending)||`<div class="chat-error" role="alert">${esc(c.error)} <a href="/login">Sign in</a></div>`):''}${c.uncertain?'<p class="chat-help" role="status">Delivery is uncertain. Refresh the conversation to check before sending again.</p>':''}<div id="chat-material-options">${chatMaterialPicker(code)}</div><div class="chat-send-row"><span class="chat-budget">${c.budget?`${c.budget.questions_left} questions · ${Number(c.budget.tokens_left).toLocaleString('en-GB')} tokens left today<br>Shared Ask budget · resets 00:00 UTC`:'Loading shared Ask budget…'}</span><button class="btn primary" type="submit" ${pending||!c.loaded||exhausted||c.uncertain?'disabled':''}>${pending?'Answering…':'Send'} ${icon('arrow')}</button></div>${exhausted?'<p class="chat-error">The daily budget is used up.</p>':''}</form><div class="chat-handoff"><span>Need to change files or run a task?</span><button class="text-link" data-claude-handoff="${code}">Continue in Claude ${icon('arrow')}</button></div></section>`}
function paintChat(code){if(!currentProject(code)||!$('#project-chat'))return;const active=document.activeElement?.id==='project-question';const start=active?document.activeElement.selectionStart:null;$('#project-chat').innerHTML=chatPanel(code);if(active){const input=$('#project-question');input.focus();input.setSelectionRange(start,start)}const log=$('.chat-messages');if(log)log.scrollTop=log.scrollHeight}
async function loadChat(code){const c=conversation(code);if(c.loading)return;c.loading=true;paintChat(code);try{const data=await readAPI('/api/projects/'+code+'/chat');c.turns=data.turns;c.budget=data.budget;c.older_turns=data.older_turns;c.loaded=true;c.error='';if(c.requestId){const found=c.turns.find(t=>t.id===c.requestId);if(found){c.draft='';c.requestId=null;c.uncertain=false}else if(c.uncertain){c.uncertain=false;c.error='This question is not in the saved conversation. You can send it again; the same request ID prevents duplicate processing.'}}}catch(e){c.error=e.message;c.errorAction='load'}finally{c.loading=false;paintChat(code);clearTimeout(chatPoll);if(currentProject(code)&&c.turns.some(t=>t.status==='pending')&&!c.error)chatPoll=setTimeout(()=>loadChat(code),5000)}}
async function sendProjectQuestion(code){const c=conversation(code);if(c.sending||c.uncertain||c.turns.some(t=>t.status==='pending'))return;const question=c.draft.trim();if(!question)return;c.requestId=c.requestId||crypto.randomUUID().replaceAll('-','');c.sending=true;c.error='';paintChat(code);try{const response=await fetch('/api/projects/'+code+'/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({question,request_id:c.requestId,material_ids:ownerRoutesAvailable?(c.materialIds||[]):[]})});if(!response.headers.get('Content-Type')?.includes('application/json')){c.uncertain=true;throw new Error('The connection was interrupted. Refresh the conversation to check delivery.');}const data=await response.json();if(!response.ok){if(workbenchLock(data.error)){c.uncertain=false}else if(response.status>=500){c.uncertain=true}else c.requestId=null;throw new Error(data.error||'The question could not be sent.')}c.turns=c.turns.filter(t=>t.id!==data.turn.id);c.turns.push(data.turn);c.budget=data.budget;c.draft='';c.requestId=null;c.uncertain=false}catch(e){c.error=e.message;c.errorAction='send';if(e instanceof TypeError)c.uncertain=true}finally{c.sending=false;paintChat(code);if(c.turns.some(t=>t.status==='pending')){clearTimeout(chatPoll);chatPoll=setTimeout(()=>loadChat(code),3000)}}}
function showHandoff(code){const c=conversation(code);const p=live.detail;const last=c.turns.filter(t=>t.status==='complete').slice(-1)[0];const prompt=`Continue work on AWB project ${code}.\nRead its current SCOPE.md, STATE.md, OPEN.md and RESOURCES.md first. Check the project's session ownership before making changes. Follow the project's instructions and preserve existing work.\nReport the last recorded status, blockers and proposed next step before acting.\n${p?.code===code?'Project goal: '+p.goal+'\n':''}${last?'Latest web question: '+last.question+'\nLatest web answer (discussion, verify against project sources):\n'+last.answer+'\n':''}${c.draft?'My next request: '+c.draft+'\n':''}`;$('#detail-title').textContent='Continue in Claude';$('#detail-body').innerHTML=`<p>Open <strong>${esc(code)}</strong> in your usual Claude working session, then paste this handoff. This does not launch an app or resume an existing session automatically.</p><label class="handoff-label" for="handoff-prompt">Project handoff</label><textarea id="handoff-prompt" rows="12" readonly>${esc(prompt)}</textarea><button class="btn primary" id="copy-handoff">Copy handoff</button><span id="handoff-feedback" role="status"></span>`;$('#detail').showModal()}
document.addEventListener('input',e=>{if(e.target.id==='project-question'){const c=conversation(e.target.form.dataset.code);c.draft=e.target.value;if(!c.uncertain)c.requestId=null}});
document.addEventListener('submit',e=>{if(e.target.id==='project-chat-form'){e.preventDefault();sendProjectQuestion(e.target.dataset.code)}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.chatRefresh)loadChat(b.dataset.chatRefresh);if(b.dataset.chatRetrySend)sendProjectQuestion(b.dataset.chatRetrySend);if(b.dataset.chatSuggest){const input=$('#project-question');if(input&&!input.disabled){const c=conversation(live.detail.code);c.draft=b.dataset.chatSuggest;c.requestId=null;paintChat(live.detail.code);$('#project-question').focus()}}if(b.dataset.claudeHandoff)showHandoff(b.dataset.claudeHandoff);if(b.id==='copy-handoff'){try{await navigator.clipboard.writeText($('#handoff-prompt').value);$('#handoff-feedback').textContent=' Copied'}catch{$('#handoff-prompt').select();$('#handoff-feedback').textContent=' Select and copy the text above.'}}});
window.addEventListener('hashchange',()=>clearTimeout(chatPoll));

function showProject(p){const docs=p.documents;const deliverables=p.deliverables;const rows=deliverables.items;const st=p.status||{};const reviewed=deliverables.status==='available'?rows.filter(r=>r.state==='valid').length:null;
 const kpi=(tab,l,v,sub,dot)=>`<a class="pult-kpi" href="#project/${p.code}" data-detail-tab="${tab}"><span class="pult-kpi-l"><i class="sdot ${dot}"></i>${l}</span><strong>${v}${sub?`<small>${sub}</small>`:''}</strong></a>`;
 const stateDot=p.state==='active'?(st.behind>0?'run':'ok'):'idle';
 $('#live-project').innerHTML=`<a class="text-link pult-back" href="#projects">← All projects</a>
<div class="page-head proj-head"><div><div class="eyebrow">${esc(projectKindLabel(p.kind))}</div><h1>${esc(p.goal||p.code)}</h1><div class="proj-meta"><code class="pult-code">${esc(p.code)}</code><span>${p.customer==='none'?'Internal':esc(p.customer)}</span><span><i class="sdot ${stateDot}"></i>${p.state==='active'?(st.behind>0?'status behind':'active'):'closed'}</span><span>created ${esc(p.created)}</span><span>updated ${esc(pultTime(p.updated))}</span></div></div><div class="head-actions"><button class="btn" data-refresh-project="${esc(p.code)}">${icon('clock')}Refresh</button></div></div>
${creationWarnings.has(p.code)?`<p class="notice">${esc(creationWarnings.get(p.code))}</p>`:''}
<div class="pult-kpis proj-kpis">${kpi('open','Open items',p.open_items??'—','',p.open_items?'idle':'ok')}${kpi('resources','Live cloud resources',p.live_resources??'—','',p.live_resources?'run':'ok')}${kpi('deliverables','Reviewed deliverables',reviewed??'—',deliverables.status==='available'?`of ${rows.length}`:'',reviewed!==null&&reviewed<rows.length?'wait':'ok')}${kpi('state','Status as of',st.updated?esc(pultTime(st.updated)):'—','',st.summary===null?'idle':st.behind>0?'run':'ok')}${projectCost(p.code)===null?'':kpi('resources','Cloud cost (est.)',eur(projectCost(p.code)),'EUR / month',projectCost(p.code)>0?'wait':'ok')}</div>
<div class="proj-cols"><div class="proj-main">
<section class="panel pult-sec proj-status"><div class="pult-head"><h2>Status</h2><span>STATE.md${st.behind>0?` · ${esc(st.behind)} changes since`:''}</span></div><div class="proj-status-body">${st.summary===null||st.summary===undefined?'<p class="muted">No status recorded yet. It appears once the working session writes the Status: and Next: lines of STATE.md.</p>':`<p>${esc(st.summary)}</p>`}${st.next?`<h3>Next</h3><p>${esc(st.next)}</p>`:''}${st.behind>0?`<div class="notice">The recorded status may be out of date: ${esc(st.behind)} changes since ${statusDateTime(st.updated)}.</div>`:''}</div></section>
<section class="panel pult-sec"><div class="tabs detail-tabs">${[['state','State'],['materials','Inputs'],['open','Open items'],['resources','Resources'],['deliverables','Deliverables'],['scope','Scope']].filter(([id])=>ownerRoutesAvailable||id!=='materials').map(([id,title])=>`<button data-detail-tab="${id}" aria-pressed="${id==='state'}">${title}</button>`).join('')}</div><div id="project-section"></div></section>
</div><aside class="proj-side"><div id="project-chat">${chatPanel(p.code)}</div></aside></div>
<div class="panel-footer" style="border:0;padding-left:0"><span>Loaded from the project files</span><span><code>${esc(p.code)}</code></span></div>`;renderProjectSection('state');loadChat(p.code);loadMaterials(p.code)}
function renderProjectSection(tab){const p=live.detail;if(!p)return;$$('.detail-tabs [data-detail-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.detailTab===tab));if(tab==='materials'){if(ownerRoutesAvailable)renderMaterials(p.code);return}const names={state:['Current state','STATE.md'],open:['Open questions and tasks','OPEN.md'],resources:['Resource register','RESOURCES.md'],scope:['Project scope','SCOPE.md']};if(tab==='deliverables'){const data=p.deliverables;const labels={valid:'Reviewed',stale:'Review stale',missing:'Review missing',unreadable:'Cannot review as text'};const body=data.status!=='available'?'<div class="empty"><strong>Review status unavailable</strong><p>The deliverable records could not be read safely.</p></div>':data.items.length?`<div class="table-wrap" tabindex="0" aria-label="Project deliverables"><table><thead><tr><th>Document</th><th>Review state</th><th>Tier</th></tr></thead><tbody>${data.items.map(r=>`<tr><td class="deliverable-name">${esc(r.file)}</td><td>${badge(labels[r.state]||r.state,r.state==='valid'?'green':r.state==='stale'?'amber':'gray')}</td><td>${r.tier??'Not set'}</td></tr>`).join('')}</tbody></table></div>${data.truncated?'<p class="results-note">Showing the first 300 deliverables.</p>':''}`:'<div class="empty"><strong>No deliverables yet</strong><p>No deliverable files have been recorded in this project.</p></div>';$('#project-section').innerHTML=detailPanel('Deliverables and reviews','deliverables/',body)}else{const [title,name]=names[tab]||names.state;$('#project-section').innerHTML=detailPanel(title,name,tab==='resources'?resourceDocument(p.documents[name]):plainDocument(p.documents[name]))}}
function knowledgePage(){return head('Knowledge','Find the evidence. Check its grade and age before you use it.')+`<section class="panel"><div class="toolbar"><label class="grow">Search knowledge<input id="kb-query" type="search" placeholder="Try CCE, region or storage" value="${esc(state.query)}"></label><label>Source grade<select id="kb-grade">${['all','live','contract','docs','said','assumed'].map(x=>`<option value="${x}" ${state.grade===x?'selected':''}>${x==='all'?'All grades':x}</option>`).join('')}</select></label><label>Freshness<select id="kb-freshness">${[['all','All entries'],['current','Within check window'],['expired','Expired']].map(([v,t])=>`<option value="${v}" ${state.freshness===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn" id="kb-reset">Reset</button></div><div id="kb-results" aria-live="polite"></div></section>`}
function clearKnowledgeSearch(){clearTimeout(knowledgeTimer);knowledgeTimer=null;knowledgeRequest++;Object.assign(knowledgeLive,{data:null,lastQuery:'',loading:false,error:'',status:null})}
function queueKnowledgeSearch(){clearKnowledgeSearch();if(state.query.trim()){knowledgeLive.loading=true;knowledgeTimer=setTimeout(()=>searchKnowledge(),300)}renderFacts()}
async function searchKnowledge(query=state.query.trim()){
 clearTimeout(knowledgeTimer);knowledgeTimer=null;
 query=query.trim();if(!query){clearKnowledgeSearch();renderFacts();return}
 const request=++knowledgeRequest;
 Object.assign(knowledgeLive,{data:null,lastQuery:query,loading:true,error:'',status:null});renderFacts();
 try{const data=await readAPI('/api/kb?q='+encodeURIComponent(query),{notFound:'Knowledge search is not available on this site.',serviceError:'The knowledge service did not answer.'});if(request===knowledgeRequest)knowledgeLive.data=data}
 catch(e){if(request===knowledgeRequest){knowledgeLive.error=e.status?e.message:'The knowledge service did not answer.';knowledgeLive.status=e.status}}
 finally{if(request===knowledgeRequest){knowledgeLive.loading=false;renderFacts()}}
}
function renderFacts(){
 const target=$('#kb-results');if(state.route!=='knowledge'||!target)return;
 target.setAttribute('aria-busy',String(knowledgeLive.loading));
 if(knowledgeLive.loading){target.innerHTML=`<div class="empty" role="status">${esc('Searching the knowledge base…')}</div>`;return}
 if(knowledgeLive.error){target.innerHTML=`<div class="notice" role="alert"><p>${esc(knowledgeLive.error)}</p>${knowledgeLive.status===404?'':knowledgeLive.status===401?`<a class="btn" href="/login">${esc('Sign in')}</a>`:`<button class="btn" data-retry-knowledge>${esc('Try again')}</button>`}</div>`;return}
 const data=knowledgeLive.data;
 if(!state.query.trim()||!data){target.innerHTML=`<div class="empty"><p>${esc('Type the words to search for. Facts come from the knowledge base with the name check of today.')}</p></div>`;return}
 const items=data.facts.filter(f=>(state.grade==='all'||f.grade===state.grade)&&(state.freshness==='all'||(state.freshness==='expired'?f.expired:!f.expired)));
 target.innerHTML=`<div class="results-note">${esc(items.length+' entries · '+data.source+' · fetched ')}${statusDateTime(data.fetched_at)}${data.withheld>0?` <span>${esc(data.withheld+' entries are withheld by the name check.')}</span>`:''}${data.facts.length===30?` <span>${esc('The first 30 matches. Add a word to narrow the search.')}</span>`:''}</div>`+(items.length?items.map(factRow).join(''):`<div class="empty">${icon('search')}<strong>${esc(data.facts.length?'No entries match these filters.':'No fact carries these words.')}</strong><p>${esc(data.facts.length?'Change the source grade or freshness filter.':'Try other words.')}</p></div>`)
}
function pricesPage(){return head('Prices','Compare rates without losing the region, term or unit.')+`<section class="panel"><form class="toolbar" id="price-form"><label>Service<input id="price-service" type="text" list="price-services" pattern="[a-z][a-z0-9\\-]{1,30}" required title="Use 2 to 31 lowercase letters, digits or hyphens, starting with a letter." value="${esc(state.service)}"><datalist id="price-services">${['ecs','evs','rds','cce','obs','elb','cbr','vpc','dns','smn'].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></label><label>Region<select id="price-region">${['eu-de','eu-nl','eu-ch2'].map(x=>`<option value="${esc(x)}" ${state.region===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="grow">Flavor or name contains<input id="price-flavor" placeholder="Filter by flavor or name" value="${esc(state.flavor)}"></label><button class="btn primary" type="submit" ${priceLive.loading?'disabled':''}>${icon('search')}${esc(priceLive.loading?'Looking up...':'Look up')}</button></form><div id="price-results" aria-live="polite"></div></section>`}
async function lookUpPrices(lookup={service:state.service,region:state.region,grep:state.flavor}){
 if(priceLive.loading)return;
 Object.assign(priceLive,{data:null,lastLookup:{...lookup},loading:true,error:'',status:null});renderPrices();
 try{priceLive.data=await readAPI('/api/price?service='+encodeURIComponent(lookup.service)+'&region='+encodeURIComponent(lookup.region)+'&grep='+encodeURIComponent(lookup.grep),{notFound:'Price lookup is not available on this site.',serviceError:'The price service did not answer.'})}
 catch(e){priceLive.error=e.status?e.message:'The price service did not answer.';priceLive.status=e.status||null}
 finally{priceLive.loading=false;renderPrices()}
}
function renderPrices(){
 const target=$('#price-results');if(state.route!=='prices'||!target)return;
 const button=$('#price-form button[type="submit"]');button.disabled=priceLive.loading;button.innerHTML=icon('search')+esc(priceLive.loading?'Looking up...':'Look up');
 target.setAttribute('aria-busy',String(priceLive.loading));
 if(priceLive.loading){target.innerHTML=`<div class="empty" role="status">${esc('Looking up...')}</div>`;return}
 if(priceLive.error){target.innerHTML=`<div class="notice" role="alert"><p>${esc(priceLive.error)}</p>${priceLive.status===404?'':priceLive.status===401?`<a class="btn" href="/login">${esc('Sign in')}</a>`:`<button class="btn" data-retry-price>${esc('Try again')}</button>`}</div>`;return}
 const data=priceLive.data;
 if(!data){target.innerHTML=`<div class="empty"><p>${esc('Pick a service and a region. Prices come from the public price API at the moment of the lookup.')}</p></div>`;return}

 catch(e){if(request===usageRequest){usageLive.error=e.status?e.message:'The usage service did not answer.';usageLive.status=e.status||null}}

}

}

function customerRows(){if(!ownerRoutesAvailable)return '';if(customersLive.error)return `<div class="empty"><strong>Customers unavailable</strong><p>${esc(customersLive.error)}</p><button class="btn" data-refresh-customers>Try again</button></div>`;if(!customersLive.loaded)return '<div class="empty" role="status">Loading customers…</div>';if(!customersLive.items.length)return '<div class="empty"><strong>No customers yet</strong><p>Create a customer now. You can add projects later.</p><button class="btn primary" data-new-customer>+ New customer</button></div>';return `<div class="customer-list">${customersLive.items.map(c=>{const ps=projects.filter(p=>p.customer===c.code);return `<section class="customer-row"><div class="customer-summary"><div><h3>${esc(c.name)}</h3><span class="code">${esc(c.code)}</span></div>${badge(c.active?'Active':'Retired',c.active?'green':'gray')}${c.active?newProjectButton(c.code):''}</div>${c.aliases.length?`<p class="customer-aliases">Also known as ${c.aliases.map(esc).join(' · ')}</p>`:''}<div class="customer-projects">${!live.loaded?'<span class="muted">Project list unavailable. Open Projects to retry.</span>':ps.length?ps.map(p=>`<a href="#project/${esc(p.code)}">${esc(p.goal||p.code)} <span class="code">${esc(p.code)} · ${esc(p.state)}</span></a>`).join(''):'<span class="muted">No projects yet</span>'}</div></section>`}).join('')}</div>`}
async function refreshCustomers(){if(!ownerRoutesAvailable||customersLive.loading)return;customersLive.loading=true;customersLive.error='';try{const [data]=await Promise.all([readAPI('/api/customers'),live.loaded?Promise.resolve():refreshProjects()]);customersLive.items=data.customers;customersLive.loaded=true}catch(e){customersLive.error=e.message}finally{customersLive.loading=false;if(state.route==='customers')render()}}
function creationInputs(){const f=$('#create-form');if(!f)return {};const d=new FormData(f);return creation.kind==='customer'?{name:d.get('name')||'',aliases:(d.get('aliases')||'').split('\n').map(x=>x.trim()).filter(Boolean)}:{goal:d.get('goal')||'',kind:d.get('kind')||'',customer:d.get('customer')||'none',tags:d.getAll('tags')}}
function customerOptions(selected='none'){return `<option value="none">Internal project · no customer</option>${customersLive.items.filter(c=>c.active).map(c=>`<option value="${esc(c.code)}" ${c.code===selected?'selected':''}>${esc(c.name)} · ${esc(c.code)}</option>`).join('')}`}
async function openCreation(kind,customer='',inline=false){
 if(!ownerRoutesAvailable||creation.busy)return;
 if(inline&&kind==='customer')creation.projectDraft=creationInputs();else if(!inline&&kind==='project')creation.projectDraft=null;
 creation.kind=kind;creation.inline=inline&&kind==='customer';creation.uncertain=false;creation.terminal=false;creation.payload=null;
 $('#create-title').textContent=kind==='project'?'New project':'New customer';
 $('#create-body').innerHTML='<div class="empty" role="status">Preparing form…</div>';
 if(!$('#create-dialog').open)$('#create-dialog').showModal();
 try{
 const previous=sessionStorage.getItem('awb-create-'+kind);if(previous){const result=await readAPI('/api/'+kind+'-operations/'+previous);if(result.status==='complete'){sessionStorage.removeItem('awb-create-'+kind);$('#create-dialog').close();if(kind==='project'){live.loaded=false;navTo('project/'+result.code);refreshProjects()}else{customersLive.loaded=false;navTo('customers');refreshCustomers()}return;}}
 let options={tags:[]};if(kind==='project'){const results=await Promise.allSettled([readAPI('/api/project-options'),readAPI('/api/customers')]);if(results[0].status==='rejected')throw results[0].reason;options=results[0].value;if(results[1].status==='fulfilled'){customersLive.items=results[1].value.customers;customersLive.loaded=true;customersLive.error=''}else{customersLive.error=results[1].reason.message;customersLive.items=[];customersLive.loaded=false;}}
 if(!ownerRoutesAvailable)return;
 const draft=kind==='project'?(creation.projectDraft||{goal:'',kind:'',customer:customer||'none',tags:[]}):{name:'',aliases:[]};
 if(kind==='project'){const preferred=options.kinds.includes('query')?'query':draft.customer&&draft.customer!=='none'?'engagement':'topic';const defaultKind=options.kinds.includes(preferred)?preferred:options.kinds[0]||'';if(!options.kinds.includes(draft.kind))draft.kind=defaultKind;}
 const pending=sessionStorage.getItem('awb-create-'+kind);
 $('#create-body').innerHTML=`<form id="create-form"><fieldset id="create-fields">${kind==='project'?`<label for="new-goal">Project goal</label><input id="new-goal" name="goal" maxlength="500" required autocomplete="off" placeholder="What would you like to investigate or build?" value="${esc(draft.goal)}"><p class="field-hint">Describe the work without customer names or personal details. Select the customer below.</p><label for="new-kind">Type of work</label><select id="new-kind" name="kind">${options.kinds.map(k=>`<option value="${esc(k)}" ${draft.kind===k?'selected':''}>${esc(projectKindLabels.get(k)||k)}</option>`).join('')}</select><div class="field-label"><label for="new-customer">Customer</label><button class="text-link" type="button" data-inline-customer>+ New customer</button></div><select id="new-customer" name="customer">${customerOptions(draft.customer)}</select>${customersLive.error?'<p class="field-hint form-error">The customer register could not be loaded. Internal projects are still available.</p>':''}${options.tags.length?`<details class="create-tags"><summary>Tags <span class="muted">Optional</span></summary><div>${options.tags.map(t=>`<label><input type="checkbox" name="tags" value="${esc(t)}" ${draft.tags.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div></details>`:''}<p class="field-hint create-note">Creates a workspace ready for your first conversation. No AI request or cloud resources are started.</p>`:`<label for="new-name">Customer name</label><input id="new-name" name="name" required minlength="2" maxlength="200" autocomplete="off" placeholder="Company or organisation"><label for="new-aliases">Alternative names <span class="muted">Optional</span></label><textarea id="new-aliases" name="aliases" rows="3" placeholder="One abbreviation or alternative spelling per line"></textarea><p class="field-hint">Names stay in your private customer register. Projects and AI conversations use a customer code.</p>`}</fieldset><div id="create-feedback" role="status" aria-live="polite">${pending?'<p class="notice">There is a previous submission to check. Enter the same details to retry it.</p>':''}</div><div class="create-actions"><button type="button" class="btn" data-create-cancel>${creation.inline?'Back to project':'Cancel'}</button><button type="submit" class="btn primary" id="create-submit">${pending?'Retry submission':kind==='project'?'Create project':'Create customer'}</button></div></form>`;
 $('#create-fields textarea, #create-fields input')?.focus();
 }catch(e){if(e.notOnSite||!ownerRoutesAvailable)return;$('#create-body').innerHTML=`<div class="empty"><strong>Form unavailable</strong><p>${esc(e.message)}</p><button class="btn" data-create-retry>Try again</button></div>`}
}
function creationFeedback(message){$('#create-feedback').innerHTML=`<p class="notice form-error">${esc(message)}</p>`}
async function submitCreation(){
 if(!ownerRoutesAvailable||creation.busy||creation.terminal)return;
 const kind=creation.kind,payload=creation.payload||creationInputs();
 if(kind==='project'&&payload.kind==='engagement'&&payload.customer==='none'){creationFeedback('Select a customer for customer work.');$('#new-customer').focus();return}
 let id=sessionStorage.getItem('awb-create-'+kind);if(!id){id=crypto.randomUUID().replaceAll('-','');sessionStorage.setItem('awb-create-'+kind,id)}
 creation.busy=true;creation.payload=payload;$('#create-fields').disabled=true;$('#create-submit').disabled=true;$('#create-submit').textContent='Creating…';$('#create-feedback').textContent='';
 try{
 const r=await fetch(kind==='project'?'/api/projects':'/api/customers',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...payload,request_id:id})});
 if(r.status===404){ownerRouteMissing(kind==='project'?'/api/projects':'/api/customers','POST');creation.payload=null;creation.uncertain=false;return}
 if(!r.headers.get('Content-Type')?.includes('application/json'))throw new Error('Connection interrupted. Retry to check the same submission.');
 const data=await r.json();
 if(!r.ok){if(r.status<500&&r.status!==401&&!data.terminal){sessionStorage.removeItem('awb-create-'+kind);creation.payload=null;creation.uncertain=false;$('#create-fields').disabled=false}else{creation.uncertain=true;creation.terminal=!!data.terminal}
 creationFeedback(data.error||'The operation could not finish.');
 if(data.matches)$('#create-feedback').innerHTML+=data.matches.map(code=>`<button type="button" class="btn" data-use-customer="${esc(code)}">Open ${esc(code)}</button>`).join('');
 if(r.status===401)$('#create-feedback').innerHTML+='<p><a class="text-link" href="/login" target="_blank" rel="noopener">Sign in in a new tab, then retry here</a></p>';
 return;
 }
 sessionStorage.removeItem('awb-create-'+kind);creation.payload=null;creation.uncertain=false;
 if(kind==='project'){$('#create-dialog').close();live.loaded=false;state.projectTab='Active';navTo('project/'+data.code);refreshProjects();if(data.warning)creationWarnings.set(data.code,data.warning)}
 else{customersLive.loaded=false;await refreshCustomers();if(creation.inline){const draft=creation.projectDraft;draft.customer=data.code;creation.busy=false;await openCreation('project',data.code,true);creation.projectDraft=draft;restoreProjectDraft(draft)}else{$('#create-dialog').close();navTo('customers');if(state.route==='customers')render()}}
 }catch(e){creation.uncertain=true;creationFeedback(e.message||'Connection interrupted. Retry the same submission.')}
 finally{creation.busy=false;const b=$('#create-submit');if(b){b.disabled=creation.terminal;b.textContent=creation.uncertain?'Retry submission':creation.kind==='project'?'Create project':'Create customer'}if(!creation.uncertain)$('#create-fields')?.removeAttribute('disabled')}
}
function restoreProjectDraft(d){if(!$('#new-goal'))return;$('#new-goal').value=d.goal;$('#new-kind').value=d.kind;$('#new-customer').value=d.customer;$$('#create-fields input[name=tags]').forEach(x=>x.checked=d.tags.includes(x.value))}
const creationWarnings=new Map();
function cancelCreation(){if(creation.busy)return;if(creation.inline&&creation.kind==='customer'){const d=creation.projectDraft;creation.inline=false;openCreation('project','',true).then(()=>{creation.projectDraft=d;restoreProjectDraft(d)})}else $('#create-dialog').close()}
$('#create-dialog').addEventListener('cancel',e=>{if(creation.busy||creation.inline){e.preventDefault();cancelCreation()}});
document.addEventListener('submit',e=>{if(e.target.id==='create-form'){e.preventDefault();submitCreation()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-new-project'))openCreation('project',b.dataset.newProject);if(b.hasAttribute('data-new-customer'))openCreation('customer');if(b.hasAttribute('data-inline-customer'))openCreation('customer','',true);if(b.hasAttribute('data-create-cancel'))cancelCreation();if(b.hasAttribute('data-create-retry'))openCreation(creation.kind);if(b.hasAttribute('data-refresh-customers'))refreshCustomers();if(b.dataset.useCustomer){const code=b.dataset.useCustomer;if(creation.inline){const d=creation.projectDraft;d.customer=code;openCreation('project',code,true).then(()=>restoreProjectDraft(d))}else{$('#create-dialog').close();navTo('customers')}}});

const materialsByProject=new Map();
function materialsState(code){if(!materialsByProject.has(code))materialsByProject.set(code,{items:[],loaded:false,loading:false,error:''});return materialsByProject.get(code)}
function materialStatus(s){return {queued:'Queued',processing:'Checking',publishing:'Adding to project',ready:'Ready',held:'Needs review',failed:'Failed',duplicate:'Already imported'}[s]||s}
function materialSources(turn){try{const sources=JSON.parse(turn.material_sources||'[]');return sources.length?`<div class="used-inputs">Inputs used: ${sources.map(s=>`${esc(s.file)} · v${s.version}${s.truncated?' (excerpt)':''}`).join(' · ')}</div>`:''}catch{return ''}}
function chatMaterialPicker(code){if(!ownerRoutesAvailable)return '';const m=materialsState(code),c=conversation(code),selected=c.materialIds||[];const ready=m.items.filter(x=>x.state==='ready');return `<div class="chat-input-picker"><details ${selected.length?'open':''}><summary>Project inputs <span class="muted">${selected.length} selected · up to 5</span></summary>${ready.length?ready.map(x=>`<label><input type="checkbox" data-chat-material="${esc(x.id)}" data-code="${code}" ${selected.includes(x.id)?'checked':''} ${c.sending||c.uncertain||c.turns.some(t=>t.status==='pending')?'disabled':''}><span>${esc(x.name)} · v${x.version}<small class="code">${esc(x.filename)}</small></span></label>`).join(''):`<p class="field-hint">${esc(m.loading?'Loading inputs…':m.error?'Inputs could not be loaded. Open the Inputs tab to retry.':'No ready inputs yet. Open the Inputs tab for details.')}</p>`}<p class="field-hint">Only selected working copies are sent with your question. Large files may be excerpted.</p></details></div>`}
function updateChatMaterials(code){if(currentProject(code)&&$('#chat-material-options'))$('#chat-material-options').innerHTML=chatMaterialPicker(code)}
async function loadMaterials(code){if(!ownerRoutesAvailable)return;const m=materialsState(code);if(m.loading)return;m.loading=true;m.error='';try{const d=await readAPI('/api/projects/'+code+'/materials');if(ownerRoutesAvailable){m.items=d.items;m.loaded=true}}catch(e){if(!e.notOnSite)m.error=e.message}finally{m.loading=false;if(currentProject(code)){if($('#materials-view'))paintMaterials(code);updateChatMaterials(code)}}}
async function previewMaterial(code,id){if(!ownerRoutesAvailable)return;$('#detail-title').textContent='Working copy';$('#detail-body').textContent='Loading checked text…';$('#detail').showModal();try{const d=await readAPI('/api/projects/'+code+'/materials/'+id);$('#detail-body').innerHTML=`<p class="code">${esc(d.filename)} · v${d.version}</p><pre class="input-preview">${esc(d.text)}</pre>`}catch(e){if(e.notOnSite){$('#detail').close();$('#detail-body').innerHTML='';return}const notice=lockedNotice(e.message,`data-view-material="${esc(id)}" data-code="${esc(code)}"`);if(notice)$('#detail-body').innerHTML=notice;else $('#detail-body').textContent=e.message}}
function renderMaterials(code){if(!ownerRoutesAvailable)return;$('#project-section').innerHTML='<div id="materials-view"></div>';paintMaterials(code);if(!materialsState(code).loaded&&!materialsState(code).loading)loadMaterials(code)}
function paintMaterials(code){if(!ownerRoutesAvailable)return;const m=materialsState(code);if(!$('#materials-view')||!currentProject(code))return;$('#materials-view').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Project inputs</h2><p>${esc('Working copies already in this project.')}</p></div><button class="btn" data-material-refresh="${code}" ${m.loading?'disabled':''}>Refresh status</button></div>${m.error?(lockedNotice(m.error,`data-material-refresh="${esc(code)}"`,m.loading)||`<p class="notice">${esc(m.error)}</p>`):''}${!m.loaded?(workbenchLock(m.error)?'':'<div class="empty" role="status">Loading inputs…</div>'):m.items.length?`<div class="table-wrap" tabindex="0" aria-label="Imported inputs"><table><thead><tr><th>Document</th><th>Source / version</th><th>Status</th><th>Imported</th></tr></thead><tbody>${m.items.map(x=>`<tr><td class="input-document"><strong>${esc(x.name)}</strong><span class="code">${esc(x.filename)}</span><p>${esc(x.message)}</p>${x.state==='ready'?`<button class="text-link" data-view-material="${x.id}" data-code="${code}">View working copy</button>`:''}</td><td>${x.source==='customer'?'Customer material':'Task description'}<br>v${x.version}</td><td>${badge(materialStatus(x.state),x.state==='ready'?'green':x.state==='held'||x.state==='failed'?'amber':'gray')}</td><td>${dateLabel(x.created)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No inputs yet</strong><p>${esc('No inputs have been added to this project yet.')}</p></div>`}<div class="panel-footer"><span>Ready copies are available in the project input folder.</span><button class="text-link" data-use-materials="${code}" ${!m.items.some(x=>x.state==='ready')?'disabled':''}>Use inputs in chat ${icon('arrow')}</button></div></section><section class="panel material-add"><div class="panel-head"><div><h2>${esc('Add files')}</h2><p>${esc('Files for this project go into its folder in/ of the bucket. The session takes them with: take the files from in')}</p></div></div></section>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.viewMaterial)previewMaterial(b.dataset.code,b.dataset.viewMaterial);if(b.dataset.materialRefresh)loadMaterials(b.dataset.materialRefresh);if(b.dataset.useMaterials){const code=b.dataset.useMaterials,c=conversation(code);if(c.sending||c.uncertain||c.turns.some(t=>t.status==='pending'))return;c.materialIds=materialsState(code).items.filter(x=>x.state==='ready').slice(0,5).map(x=>x.id);c.draft='Read the selected inputs. Summarize the task, expected outcome, constraints and missing information. Cite the input files and distinguish requirements from assumptions.';c.requestId=null;paintChat(code);$('#project-chat').scrollIntoView({behavior:'smooth',block:'start'});$('#project-question').focus()}});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.chatMaterial){const c=conversation(b.dataset.code);c.materialIds=c.materialIds||[];if(b.checked&&c.materialIds.length>=5){b.checked=false;return}c.materialIds=b.checked?[...c.materialIds,b.dataset.chatMaterial]:c.materialIds.filter(id=>id!==b.dataset.chatMaterial);c.requestId=null;updateChatMaterials(b.dataset.code)}});

window.addEventListener('hashchange',render);render();

document.getElementById("theme-toggle").addEventListener("click",function(){var r=document.documentElement,l=r.getAttribute("data-theme")!=="light";if(l)r.setAttribute("data-theme","light");else r.removeAttribute("data-theme");try{localStorage.setItem("awb-theme",l?"light":"dark")}catch(e){}});
</script>
</body>
</html>
