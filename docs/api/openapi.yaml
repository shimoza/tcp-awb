                    error: Another answer is being prepared. Try again when it finishes.
                the-daily-ask-budget-is:
                  value:
                    error: "The daily Ask budget is used up. It resets at 00:00 UTC."
        "502":
          description: The backend did not answer, or its answer was too large.
          content:
            text/html:
              schema:
                type: string
              examples:
                the-awb-service-is-temporarily:
                  value: |
                    The AWB service is temporarily unavailable.
                the-response-was-too-large:
                  value: |
                    The response was too large.
        "503":
          description: The project, a check, an input or the usage record is unavailable. Nothing was sent.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                the-question-could-not-be:
                  value:
                    error: The question could not be accepted. Check the conversation before trying again.
                the-data-check-is-locked:
                  value:
                    error: The data check is locked. Nothing was sent.
                the-data-check-is-unavailable:
                  value:
                    error: The data check is unavailable. Nothing was sent.
                project-context-could-not-be:
                  value:
                    error: Project context could not be loaded. Nothing was sent.
                this-project-is-unavailable:
                  value:
                    error: This project is unavailable.
                the-project-snapshot-is-too:
                  value:
                    error: The project snapshot is too large.
                the-usage-record-is-unavailable:
                  value:
                    error: The usage record is unavailable. No new questions can be sent.
                the-selected-input-could-not:
                  value:
                    error: The selected input could not be read. Nothing was sent.
                the-input-service-is-unavailable:
                  value:
                    error: The input service is unavailable. Check the bucket connection and vault.
                the-local-response-exceeds-the:
                  value:
                    error: The local response exceeds the size limit.
