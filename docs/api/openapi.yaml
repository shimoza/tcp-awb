    Board:
      type: object
      description: The status of every active project for management, codes only.
      properties:
        source:
          type: string
          enum:
            - AWB project register
        generated_at:
          type: string
          description: When the board was put together.
          format: date-time
        summary:
          type: object
          properties:
            projects:
              type: integer
              description: Active projects.
            current:
              type: integer
              description: Projects whose recorded status has its two lines and no later commit.
            lagging:
              type: integer
              description: Projects with commits newer than their recorded status.
            without_status:
              type: integer
              description: "Projects whose STATE.md has no Status: line yet."
          required:
            - projects
            - current
            - lagging
            - without_status
        projects:
          type: array
          description: Active projects, latest change first.
          items:
            "$ref": "#/components/schemas/BoardProject"
      required:
        - source
        - generated_at
        - summary
        - projects
    ProjectOptions:
      type: object
      properties:
        kinds:
          type: array
          description: "The kinds the running backend accepts, in the order to show. Deployed: engagement, lab, topic, code. Repository: query, project."
          items:
            type: string
        tags:
          type: array
          description: The technology tags a project may carry.
          items:
            type: string
      required:
        - kinds
        - tags
    ProjectCreateRequest:
      type: object
      properties:
        request_id:
          "$ref": "#/components/schemas/RequestId"
        kind:
