        - coverage_note
    MaterialImport:
      type: object
      properties:
        id:
          "$ref": "#/components/schemas/MaterialId"
        name:
          type: string
          description: The file name in the bucket.
        source:
          type: string
          description: "brief: the lab inbox. customer: the owner's bucket, through the intake."
          enum:
            - brief
            - customer
        state:
          type: string
          description: "queued, processing and publishing run. ready: the working copy is in input/. duplicate: the same content as an earlier import. held: the owner has to look. failed: stopped, a new import may be tried."
          enum:
            - queued
            - processing
            - publishing
            - ready
            - duplicate
            - held
            - failed
        message:
          type: string
          description: One sentence on the state.
          x-awb-texts:
            - Waiting for processing.
            - Downloading and checking the selected version.
            - Adding the checked working copy to the project.
            - Checking publication of the saved working copy.
            - Ready text copy. Embedded images are not included.
            - The same content is already imported as <id>.
            - Unrecognised names require owner review in the intake report. Register or approve them, then retry.
            - The original could not be sealed. Owner review is required before release.
            - The document could not be read completely. Review it or provide a supported text version.
            - The document could not be read completely. Provide a supported text version.
            - No usable text was extracted from this file.
            - This task description may contain private information. Use the customer source or ask the owner to review it.
            - This file contains no readable text.
            - Extracted text is too large. Split this document into smaller files.
            - The working copy contains protected values. Owner review is required.
            - The staged document changed. Owner review is required.
            - The filename is unsupported.
            - The file exceeds the import limit.
            - The source changed. Refresh the file list and import its current version.
            - The project customer changed. Import again with the correct customer.
            - Import stopped. Check the connection and vault, then retry. Source files were preserved.
            - "Processing was interrupted. Retry the import; source files were preserved."
            - Processing timed out or stopped. Retry with a smaller supported document.
            - The working copy failed its final data check.
            - The project is unavailable or its customer changed.
            - The registered project folder is unsupported.
            - An input with this identifier already exists with different content.
            - The local response exceeds the size limit.
            - The AWB bucket connection is not configured.
            - Bucket read access is unavailable (HTTP <status>).
            - The bucket could not be read. Try again later.
            - Project not found.
            - Reopen this project before importing files.
            - The customer is unavailable or retired.
            - "The key service is locked: the owner runs awb keys unlock."
            - The key service is unavailable. Try again later.
            - Ready text copy from the project folder.
        created:
          type: string
          format: date-time
        version:
          type: integer
          description: The version of this source file in the project.
        filename:
          type: string
          description: "The working copy in the project: <id>.md."
        size:
          type: integer
          description: Bytes of the source file.
      required:
        - id
        - name
        - source
        - state
        - message
        - created
        - version
        - filename
        - size
    MaterialHistory:
      type: object
      properties:
        items:
          type: array
          description: Latest first, at most 500.
          items:
            "$ref": "#/components/schemas/MaterialImport"
        busy:
          type: boolean
          description: true while an import runs.
      required:
        - items
        - busy
    SourceFile:
      type: object
      properties:
        id:
          type: string
          description: Stable for this project, source and file.
          pattern: "^[a-f0-9]{64}$"
        name:
          type: string
        etag:
          type: string
          description: The version of the file in the bucket.
        size:
          type: integer
        modified:
          type: string
          description: As the bucket reports it.
        status:
          type: string
          description: "new: never imported. updated: imported before, changed since. imported: this version is ready or a duplicate. processing: this version is being imported."
          enum:
            - new
            - updated
            - imported
            - processing
        supported:
          type: boolean
          description: false for an unknown type, an empty file or one above the limit.
        location:
          type: string
          enum:
            - Unassigned inbox
            - Project folder
      required:
        - id
        - name
        - etag
        - size
        - modified
        - status
        - supported
        - location
    MaterialSources:
      type: object
      properties:
        source:
          type: string
          enum:
            - brief
            - customer
        files:
          type: array
          items:
            "$ref": "#/components/schemas/SourceFile"
        limit_mb:
          type: integer
          description: The largest file in MB.
      required:
        - source
        - files
        - limit_mb
    ImportRequest:
      type: object
      properties:
        request_id:
          "$ref": "#/components/schemas/RequestId"
        files:
          type: array
          description: "1 to 10 files of the last listing, each once."
          items:
            type: object
            properties:
              id:
                type: string
                pattern: "^[a-f0-9]{64}$"
              etag:
                type: string
                description: The etag of the listing. A file that changed since is refused.
            required:
              - id
              - etag
            additionalProperties: false
          minItems: 1
          maxItems: 10
      required:
        - request_id
        - files
      additionalProperties: false
    ImportAccepted:
      type: object
      properties:
        imports:
          type: array
          description: One id per file, in the order sent. A version imported before keeps its id.
          items:
            "$ref": "#/components/schemas/MaterialId"
      required:
        - imports
    MaterialText:
      type: object
      properties:
        id:
          "$ref": "#/components/schemas/MaterialId"
        version:
          type: integer
        filename:
          type: string
        imported:
          type: string
          format: date-time
        text:
          type: string
          description: The checked working copy, at most 256 KiB.
      required:
        - id
        - version
        - filename
        - imported
        - text
    ChatTurn:
      type: object
      properties:
        id:
          "$ref": "#/components/schemas/RequestId"
        project:
          "$ref": "#/components/schemas/ProjectCode"
        question:
          type: string
          description: "After the data check. [Text withheld by the data check.] when a later check withholds it."
        answer:
          type: string
          description: Empty while pending and after a failure.
        status:
          type: string
          enum:
            - pending
            - complete
            - failed
        error:
          type: string
          description: "Why it failed; empty otherwise. A failed turn is never resent by itself."
          x-awb-texts:
            - Not enough daily token budget remains for this answer.
            - The model returned no usable usage record. The token allowance remains reserved.
            - The model declined this question.
            - The model returned an empty answer.
            - The model requested an unsupported tool.
            - The model returned no usable tool request.
            - The answer reached its tool limit. Ask a narrower question.
            - The answer could not be completed. It will not be resent automatically.
            - The service restarted before completion. This request will not be resent automatically.
            - The data check is locked. Nothing was sent.
            - The data check is unavailable. Nothing was sent.
            - The text contains a name, address or protected value. Use project and customer codes.
            - The usage record is unavailable. No new questions can be sent.
        created:
          type: string
          format: date-time
        completed:
          type:
            - string
            - "null"
          format: date-time
        tokens:
          type: integer
          description: Tokens this answer used.
        tools:
          type: string
          description: "A JSON array as text: the sources the answer used (kb_find, price_find, tenant_now and, with selected inputs, input_find)."
        context_time:
          type:
            - string
            - "null"
          description: "When the project snapshot was taken, YYYY-MM-DD HH:MM UTC."
        material_ids:
          type: string
          description: "A JSON array as text: the inputs the question selected."
        material_sources:
          type: string
          description: "A JSON array as text: id, file, version, imported and truncated of each input, and for a long input the places of the passages sent, such as \"3, 7 of 12\"."
      required:
        - id
        - project
        - question
        - answer
        - status
        - error
        - created
        - completed
        - tokens
        - tools
        - context_time
        - material_ids
        - material_sources
