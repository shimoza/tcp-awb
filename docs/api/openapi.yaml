          type:
            - integer
            - "null"
        eip:
          type:
            - integer
            - "null"
        vpc:
          type:
            - integer
            - "null"
        ims:
          type:
            - integer
            - "null"
        running:
          type:
            - integer
            - "null"
        stopped:
          type:
            - integer
            - "null"
        attached_disks:
