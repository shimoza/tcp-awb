openapi: "3.1.0"
info:
  title: Architect Workbench web API
  version: "0.1.0"
  description: |-
    The HTTP interface of the Architect Workbench web console. The console page and every route below are served
    by one gateway. It checks the session and the request, then hands the request to the backend that owns the
    route.

    State: this document describes what is deployed, the gateway and the backends of 2026-10-02. Production is
    frozen while the backend moves into the repository. Every operation carries x-awb-state: deployed runs in
    production as written here, repository exists in the repository only and is not deployed yet.

    One change waits in the repository: the project kinds. The deployed backend knows engagement, lab, topic and
    code. The repository knows query and project and reads the old words as one of them (schema Kind).
    GET /api/project-options always serves the kinds of the running backend.

    Planned, not in this version: the same routes under /api/v1/ with the old paths kept until the interface has
    switched, and GET /api/v1/version with the backend commit and the time of the deploy.

    Rules for every route:
    - Customers, projects and tenants appear as codes (CUST-Q7M4, tcp-q7m4, test-1). Only /api/customers carries
      registered names, for the owner's own console.
    - A backend answers JSON. A refusal is {"error": "<one sentence>"}, at times with field, terminal, code or
      matches. A refusal of the gateway itself is one line of text/html.
    - A write carries request_id, 32 lower-case hex characters made by the browser for one submission. The same
      request_id with the same content returns the first result, so a retry after a broken connection is safe.
      The same request_id with other content is refused with 409.
    - A POST needs the session cookie, the site's own Origin, Sec-Fetch-Site same-origin or none, one
      Content-Length of at most 16384 bytes and the content type of its route.
    - Times are ISO 8601 in UTC unless a field says otherwise. HEAD works wherever GET does.
    - Without a session every /api/ route answers 401 and a page answers 303 to /login.
    - Any path: a wrong host gets 400 Invalid host., a target that is not a path 400 Invalid request target.,
      an unknown path 404 Not found. and a method other than GET, HEAD or POST 405 Method not allowed., each as
      one line of text/html (info.x-awb-texts). Without a session, when 64 requests without a session are already
      open, any path gets 503 The site is busy. Try again in a moment. with Retry-After: 5.

    The gateway also serves the older server-rendered pages /kb, /price, /projects, /reviews, /tenants, /health
    and /portal. They are HTML, the console does not call them and they are not part of this contract.
  x-awb-deployed: "2026-10-02"
  x-awb-texts:
    - Invalid host.
    - Invalid request target.
    - Not found.
    - Method not allowed.
    - The site is busy. Try again in a moment.
servers:
  - url: /
    description: "The site itself: the console and the API share one origin."
security:
  - session: []
tags:
  - name: session
    description: Sign in and sign out. A session lasts up to 8 hours.
  - name: pages
    description: The HTML pages the console uses.
  - name: projects
    description: The project register, read and create.
  - name: customers
    description: "The customer register. Owner only: it carries names."
  - name: tenants
    description: The test tenants, read only.
  - name: materials
    description: Inputs from the buckets, copied into a project.
  - name: chat
    description: Questions about a project, answered from checked sources only.
paths:
  /login:
    get:
      operationId: signInPage
      tags:
        - session
      summary: The sign-in page.
      parameters:
        - name: next
          in: query
          required: false
          description: A page to open after the sign-in. Anything else becomes /.
          schema:
            type: string
      responses:
        "200":
          description: The form. Sets the __Host-awb-login cookie for 600 seconds.
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><form action=\"/login\" method=\"post\">...</form></body></html>"
        "303":
          description: Already signed in.
          headers:
            Location:
              description: The next page.
              schema:
                type: string
        "400":
          description: The query cannot be read.
          content:
            text/html:
              schema:
                type: string
              examples:
                invalid-query:
                  value: |
                    Invalid query.
      security: []
      x-awb-state: deployed
    post:
      operationId: signIn
      tags:
        - session
      summary: Sign in with the username and the password.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf:
                  type: string
                  description: "The hidden field of the sign-in page; it must equal the __Host-awb-login cookie, is valid for 600 seconds and is taken once."
                username:
                  type: string
                  maxLength: 100
                password:
                  type: string
                  maxLength: 200
                next:
                  type: string
                  description: Where to go after the sign-in.
                  enum:
                    - /
                    - /kb
                    - /price
                    - /projects
                    - /reviews
                    - /tenants
                    - /health
                    - /portal
                    - /ask
              required:
                - csrf
                - username
                - password
              additionalProperties: false
            examples:
              sign-in:
                value:
                  csrf: "<the hidden field>"
                  username: "<username>"
                  password: "<password>"
                  next: /
      responses:
        "200":
          description: "The username or the password is wrong: the form again, with the reason."
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><p role=\"alert\" class=\"error\">The username or password is incorrect.</p><form action=\"/login\" method=\"post\">...</form></body></html>"
        "303":
          description: Signed in.
          headers:
            Location:
              description: The next page.
              schema:
                type: string
            Set-Cookie:
              description: "__Host-awb-session: valid for 8 hours, Secure, HttpOnly, SameSite=Lax."
              schema:
                type: string
        "400":
          description: The form cannot be read.
          content:
            text/html:
              schema:
                type: string
              examples:
                a-single-content-length-is:
                  value: |
                    A single content length is required.
                invalid-form:
                  value: |
                    Invalid form.
        "403":
          description: "The form expired or came from another site: the form again, with the reason. The form was not sent from the site."
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><p role=\"alert\" class=\"error\">The sign-in form expired. Please try again.</p><form action=\"/login\" method=\"post\">...</form></body></html>"
                open-this-form-on-the:
                  value: |
                    Open this form on the AWB site.
        "413":
          description: The form is larger than 16384 bytes.
          content:
            text/html:
              schema:
                type: string
              examples:
                request-is-too-large:
                  value: |
                    Request is too large.
        "415":
          description: The body is not a form.
          content:
            text/html:
              schema:
                type: string
              examples:
                use-the-sign-in-form:
                  value: |
                    Use the sign-in form.
        "429":
          description: "Eight failed attempts from one address (the /64 of an IPv6 address) within a minute or a sign-in of that address still running, or a cooldown: the login failed 5 times within 15 minutes (it waits 15 minutes, doubled for each further series up to 24 hours), or the site had 30 failures within the hour."
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><p role=\"alert\" class=\"error\">Too many attempts. Try again in one minute.</p><form action=\"/login\" method=\"post\">...</form></body></html>"
                cooldown:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><p role=\"alert\" class=\"error\">Too many failed sign-ins. Try again later.</p><form action=\"/login\" method=\"post\">...</form></body></html>"
        "503":
          description: "No pbkdf2 slot came free within 3 seconds (not counted as a failure), or the session table is full: the form again, with the reason."
          content:
            text/html:
              schema:
                type: string
              examples:
                busy:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><p role=\"alert\" class=\"error\">The sign-in is busy. Try again in a moment.</p><form action=\"/login\" method=\"post\">...</form></body></html>"
                full:
                  value: "<!doctype html><html lang=\"en\"><head><title>Sign in · AWB</title></head><body><p role=\"alert\" class=\"error\">The workspace has too many open sessions. Try again later.</p><form action=\"/login\" method=\"post\">...</form></body></html>"
      security: []
      x-awb-state: deployed
  /logout:
    get:
      operationId: signOutPage
      tags:
        - session
      summary: A page that asks before signing out.
      responses:
        "200":
          description: The page with one button.
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<html><head><title>Sign out - AWB</title></head><body><h1>Sign out of AWB?</h1><form method=\"post\" action=\"/logout\"><button>Sign out</button></form></body></html>"
        "303":
          description: No valid session.
          headers:
            Location:
              description: /login?next=<the page, or / for any other path>
              schema:
                type: string
      x-awb-state: deployed
    post:
      operationId: signOut
      tags:
        - session
      summary: End the session.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
              additionalProperties: false
            examples:
              empty:
                value: {}
      responses:
        "303":
          description: Signed out.
          headers:
            Location:
              description: /login
              schema:
                type: string
            Set-Cookie:
              description: __Host-awb-session cleared.
              schema:
                type: string
        "400":
          description: The form cannot be read.
          content:
            text/html:
              schema:
                type: string
              examples:
                a-single-content-length-is:
                  value: |
                    A single content length is required.
                invalid-form:
                  value: |
                    Invalid form.
        "403":
          description: Not sent from the site, or no session.
          content:
            text/html:
              schema:
                type: string
              examples:
                open-this-form-on-the:
                  value: |
                    Open this form on the AWB site.
                sign-in-before-submitting-a:
                  value: |
                    Sign in before submitting a question.
        "413":
          description: The form is larger than 16384 bytes.
          content:
            text/html:
              schema:
                type: string
              examples:
                request-is-too-large:
                  value: |
                    Request is too large.
        "415":
          description: The body is not a form.
          content:
            text/html:
              schema:
                type: string
              examples:
                use-the-sign-in-form:
                  value: |
                    Use the sign-in form.
      x-awb-state: deployed
  /:
    get:
      operationId: getConsole
      tags:
        - pages
      summary: "The console: one HTML page with its own script."
      responses:
        "200":
          description: The page, with a Content-Security-Policy that allows its inline scripts only.
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Architect Workbench</title></head><body>...</body></html>"
        "303":
          description: No valid session.
          headers:
            Location:
              description: /login?next=<the page, or / for any other path>
              schema:
                type: string
        "503":
          description: The page cannot be read.
          content:
            text/html:
              schema:
                type: string
              examples:
                the-workspace-is-temporarily-unavailable:
                  value: |
                    The workspace is temporarily unavailable.
      x-awb-state: deployed
  /architect-workbench.html:
    get:
      operationId: getConsoleByName
      tags:
        - pages
      summary: "The console: one HTML page with its own script."
      responses:
        "200":
          description: The page, with a Content-Security-Policy that allows its inline scripts only.
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Architect Workbench</title></head><body>...</body></html>"
        "303":
          description: No valid session.
          headers:
            Location:
              description: /login?next=<the page, or / for any other path>
              schema:
                type: string
        "503":
          description: The page cannot be read.
          content:
            text/html:
              schema:
                type: string
              examples:
                the-workspace-is-temporarily-unavailable:
                  value: |
                    The workspace is temporarily unavailable.
      x-awb-state: deployed
  /ask:
    get:
      operationId: askPage
      tags:
        - pages
      summary: "The Ask page: one general question, answered only from the checked sources."
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Ask · AWB</title></head><body>...</body></html>"
        "303":
          description: No valid session.
          headers:
            Location:
              description: /login?next=<the page, or / for any other path>
              schema:
                type: string
        "502":
          description: The backend did not answer, or its answer was too large.
          content:
            text/html:
              schema:
                type: string
              examples:
                the-awb-service-is-temporarily:
                  value: |
                    The AWB service is temporarily unavailable.
                the-response-was-too-large:
                  value: |
                    The response was too large.
      x-awb-state: deployed
    post:
      operationId: askGeneral
      tags:
        - pages
      summary: Send one general question from the Ask page.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: The question.
                  minLength: 1
                  maxLength: 1000
              required:
                - q
              additionalProperties: false
            examples:
              question:
                value:
                  q: Which flavors does the region eu-de offer for SAP HANA?
      responses:
        "200":
          description: The page with the answer and its sources, or with the reason it failed.
          content:
            text/html:
              schema:
                type: string
              examples:
                page:
                  value: "<!doctype html><html lang=\"en\"><head><title>Ask · AWB</title></head><body>...</body></html>"
        "400":
          description: The question cannot be used. The gateway refused the request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                write-a-question-of-1:
                  value:
                    error: Write a question of 1 to 1000 characters.
                the-request-could-not-be:
                  value:
                    error: The request could not be read.
            text/html:
              schema:
                type: string
              examples:
                a-single-content-length-is:
                  value: |
                    A single content length is required.
                incomplete-request:
                  value: |
                    Incomplete request.
        "403":
          description: No session. The gateway refused a request from another site.
          content:
            text/html:
              schema:
                type: string
              examples:
                sign-in-before-submitting-a:
                  value: |
                    Sign in before submitting a question.
                open-ask-on-the-awb:
                  value: |
                    Open Ask on the AWB site to submit a question.
                cross-site-requests-are-not:
                  value: |
                    Cross-site requests are not allowed.
        "408":
          description: The body did not arrive in time.
          content:
            text/html:
              schema:
                type: string
              examples:
                request-timed-out:
                  value: |
                    Request timed out.
        "413":
          description: The body is larger than 16384 bytes.
          content:
            text/html:
              schema:
                type: string
              examples:
                request-is-too-large:
                  value: |
                    Request is too large.
        "415":
          description: The body is not a form. The body has the wrong content type.
          content:
            text/html:
              schema:
                type: string
              examples:
                use-the-ask-form:
                  value: |
                    Use the Ask form.
        "422":
          description: The question holds a name or a protected value.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                the-text-contains-a-name:
                  value:
                    error: The text contains a name, address or protected value. Use project and customer codes.
        "429":
          description: One answer at a time, and a daily budget.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                another-answer-is-being-prepared:
                  value:
                    error: Another answer is being prepared. Try again when it finishes.
                the-daily-ask-budget-is:
                  value:
                    error: "The daily Ask budget is used up. It resets at 00:00 UTC."
        "502":
          description: The backend did not answer, or its answer was too large.
          content:
            text/html:
              schema:
                type: string
              examples:
                the-awb-service-is-temporarily:
                  value: |
                    The AWB service is temporarily unavailable.
                the-response-was-too-large:
                  value: |
                    The response was too large.
        "503":
          description: A check or the usage record is unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                the-data-check-is-locked:
                  value:
                    error: The data check is locked. Nothing was sent.
                the-data-check-is-unavailable:
                  value:
                    error: The data check is unavailable. Nothing was sent.
                the-usage-record-is-unavailable:
                  value:
                    error: The usage record is unavailable. No new questions can be sent.
                the-question-could-not-be:
                  value:
                    error: The question could not be accepted. Check the conversation before trying again.
      x-awb-state: deployed
  /api/projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: The registered projects that are not deleted.
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectList"
              examples:
                three-projects:
                  value:
                    source: AWB project register
                    fetched_at: "2026-10-04T09:30:00.120034+00:00"
                    projects:
                      - code: tcp-k2wd
                        kind: query
                        customer: none
                        state: active
                        created: "2026-10-01"
                        goal: Compare the object storage classes of TCP for archive data
                        goal_redacted: false
                        open_items: 2
                        live_resources: 0
                        updated: "2026-10-03T16:40:12.511204+00:00"
                        status:
                          summary: The prices of the three storage classes are fetched.
                          next: Compare the retrieval fees.
                          updated: "2026-10-03T16:40:12.511204+00:00"
                          behind: 0
                          redacted: false
                      - code: tcp-m3fx
                        kind: lab
                        customer: none
                        state: active
                        created: "2026-09-30"
                        goal: Test a virtual firewall appliance on a test tenant
                        goal_redacted: false
                        open_items: 5
                        live_resources: 3
                        updated: "2026-10-02T11:05:47.902114+00:00"
                        status:
                          summary: "The appliance image is imported; its boot waits on a disk controller."
                          next: Repeat the boot test once the controller is offered.
                          updated: "2026-10-01T20:58:03.120411+00:00"
                          behind: 3
                          redacted: false
                      - code: tcp-q7m4
                        kind: engagement
                        customer: CUST-Q7M4
                        state: closed
                        created: "2026-09-22"
                        goal: Plan the move of the customer's file servers to TCP
                        goal_redacted: false
                        open_items: 0
                        live_resources: null
                        updated: null
                        status:
                          summary: null
                          next: null
                          updated: null
                          behind: null
                          redacted: false
        "401":
          description: No valid session. Sign in first.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                sign-in-to-open-the:
                  value:
                    error: Sign in to open the project data.
        "502":
          description: The backend did not answer, or its answer was too large.
          content:
            text/html:
              schema:
                type: string
              examples:
                the-awb-service-is-temporarily:
                  value: |
                    The AWB service is temporarily unavailable.
                the-response-was-too-large:
                  value: |
                    The response was too large.
        "503":
          description: The data check or a project folder is unavailable. Nothing was returned.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                the-data-check-is-locked:
                  value:
                    error: The data check is locked. Project content was not returned.
                the-data-check-is-unavailable:
                  value:
                    error: The data check is unavailable. Project content was not returned.
                the-registered-project-folder-cannot:
                  value:
                    error: The registered project folder cannot be opened safely.
                the-registered-project-folder-is:
                  value:
                    error: The registered project folder is unavailable.
                project-data-could-not-be:
                  value:
                    error: Project data could not be read. Try again shortly.
      x-awb-state: deployed
    post:
      operationId: createProject
      tags:
        - projects
      summary: Create a project.
      description: Creates the project folder with its files and registers it. No AI call and no cloud resource. The engagement rule (a customer is required) exists in the deployed backend only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProjectCreateRequest"
            examples:
              internal-query:
                value:
                  request_id: ffffffffffffffffffffffffffffffff
                  kind: query
                  goal: Compare the object storage classes of TCP for archive data
                  customer: none
                  tags:
                    - obs
              customer-work:
                value:
                  request_id: ffffffffffffffffffffffffffffffff
                  kind: engagement
                  goal: Plan the move of the customer's file servers to TCP
                  customer: CUST-Q7M4
                  tags: []
      responses:
        "201":
          description: Created, or the result of the first submission with this request_id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreationResult"
              examples:
                created:
                  value:
                    code: tcp-k2wd
                    created: true
                recovered:
                  value:
                    code: tcp-k2wd
                    created: true
                    warning: Project recovered after an interrupted request. Its first activity entry may be missing.
                no-activity-entry:
                  value:
                    code: tcp-k2wd
                    created: true
                    warning: Project created. The first activity entry could not be written.
        "400":
          description: The content is refused. The project check of the backend may also refuse with a sentence of its own. The gateway refused the request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                unsupported-form-fields:
                  value:
                    error: Unsupported form fields.
                a-valid-request-id-is:
                  value:
                    error: A valid request ID is required.
                choose-a-project-type-and:
                  value:
                    error: Choose a project type and enter a goal of up to 500 characters.
                select-a-valid-customer-or:
                  value:
                    error: Select a valid customer or Internal project.
                select-tags-from-the-list:
                  value:
                    error: Select tags from the list.
                select-a-customer-for-customer:
                  value:
                    error: Select a customer for customer work.
                    field: customer
                this-customer-is-unavailable-or:
                  value:
                    error: This customer is unavailable or retired. Select an active customer.
                    field: customer
                invalid-request:
                  value:
                    error: Invalid request.
            text/html:
              schema:
                type: string
              examples:
                a-single-content-length-is:
                  value: |
                    A single content length is required.
                incomplete-request:
                  value: |
                    Incomplete request.
        "401":
          description: No valid session. Sign in first.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                sign-in-to-open-the:
                  value:
                    error: Sign in to open the project data.
        "403":
          description: The gateway refused a request from another site.
          content:
            text/html:
              schema:
                type: string
              examples:
                open-ask-on-the-awb:
                  value: |
                    Open Ask on the AWB site to submit a question.
                cross-site-requests-are-not:
                  value: |
                    Cross-site requests are not allowed.
        "408":
          description: The body did not arrive in time.
          content:
            text/html:
              schema:
                type: string
              examples:
                request-timed-out:
                  value: |
