        - total
    BoardProject:
      type: object
      description: "One active project on the board: the summary of the list and what management reads."
      properties:
        code:
          "$ref": "#/components/schemas/ProjectCode"
        kind:
          "$ref": "#/components/schemas/Kind"
        customer:
          "$ref": "#/components/schemas/CustomerOrNone"
        state:
          type: string
          description: Deleted projects are not listed.
          enum:
            - active
            - closed
        created:
          type: string
          description: The day the project was created.
          format: date
        goal:
          type: string
          description: "The goal line of SCOPE.md after the data check. A withheld part reads [withheld]; a goal the check still refuses reads [Content withheld by the data check.]"
        goal_redacted:
          type: boolean
          description: true when the data check withheld a part of the goal.
        open_items:
          type:
            - integer
            - "null"
          description: "Lines of OPEN.md that start with a dash; null when OPEN.md cannot be read."
        live_resources:
          type:
            - integer
            - "null"
          description: "Rows of RESOURCES.md whose state is neither deleted nor kept; null when RESOURCES.md cannot be read."
        updated:
          type:
            - string
            - "null"
          description: "The latest change of SCOPE.md, STATE.md, OPEN.md or RESOURCES.md; null when none can be read."
