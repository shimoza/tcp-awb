        open:
          "$ref": "#/components/schemas/BoardItems"
        deliverables:
          type: object
          properties:
            status:
              type: string
              description: unavailable when the folders cannot be read safely.
              enum:
                - available
                - unavailable
            counts:
              type: object
              description: "Deliverables per review state; a state with none is left out."
              properties:
                valid:
                  type: integer
                stale:
                  type: integer
                missing:
                  type: integer
                unreadable:
                  type: integer
          required:
            - status
