            text/html:
              schema:
                type: string
              examples:
                request-is-too-large:
                  value: |
                    Request is too large.
        "415":
          description: The body has the wrong content type.
          content:
            text/html:
              schema:
                type: string
              examples:
                use-the-ask-form:
                  value: |
