components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-awb-session
      description: Set by POST /login. Valid for 8 hours, Secure, HttpOnly, SameSite=Lax.
  schemas:
    Error:
      type: object
      description: A refusal of a backend.
      properties:
        error:
          type: string
          description: One sentence for the person at the screen. It carries no name and no submitted value.
        field:
          type: string
          description: The form field the refusal is about.
        terminal:
          type: boolean
          description: "true: this request_id will never succeed. Reopen the form, which makes a new request_id."
        code:
          type: string
          description: The code the stuck submission reserved.
        matches:
          type: array
          description: Existing customers with the same name.
          items:
            "$ref": "#/components/schemas/CustomerCode"
      required:
        - error
    ProjectCode:
      type: string
      description: A project code.
      pattern: "^tcp-[a-z2-7]{4}$"
    CustomerCode:
      type: string
      description: A customer code.
      pattern: "^CUST-[A-Z2-7]{4}$"
    CustomerOrNone:
      type: string
      description: A customer code, or none for an internal project.
      pattern: "^(none|CUST-[A-Z2-7]{4})$"
    RequestId:
      type: string
      description: "Made by the browser for one submission: 32 lower-case hex characters. A retry sends the same one."
      pattern: "^[a-f0-9]{32}$"
    MaterialId:
      type: string
      description: "An import: M- and 24 capital letters."
      pattern: "^M-[A-Z]{24}$"
    Kind:
      type: string
      description: "The kind of a project as stored. A query works with the knowledge base, the docs and live prices; a project also reaches a test tenant. The repository writes query and project only, older projects keep their word and it reads as x-awb-reads-as says. The deployed backend still writes the four old words."
      enum:
        - query
        - project
        - engagement
        - lab
        - topic
        - code
      x-awb-reads-as:
        engagement: query
        topic: query
        code: query
        lab: project
    ProjectStatus:
      type: object
      description: "The recorded status of a project: the two lines STATE.md opens with. The working session updates them after every step that changes the status; its stop hook holds a reply while commits are newer than STATE.md."
      properties:
        summary:
          type:
            - string
            - "null"
          description: "The Status: line of STATE.md after the data check, one sentence; null when STATE.md has none yet."
        next:
          type:
            - string
            - "null"
          description: "The Next: line of STATE.md after the data check, one sentence; null when STATE.md has none yet."
        updated:
          type:
            - string
            - "null"
          description: "When STATE.md last changed; null when it cannot be read."
          format: date-time
        behind:
          type:
            - integer
            - "null"
          description: "Commits of the project newer than STATE.md. More than 0: the recorded status lags behind the work. null when the history cannot be read."
        redacted:
          type: boolean
          description: true when the data check withheld a part of a line.
      required:
        - summary
        - next
        - updated
        - behind
        - redacted
    ProjectSummary:
      type: object
      description: One project of the list.
      properties:
        code:
          "$ref": "#/components/schemas/ProjectCode"
        kind:
          "$ref": "#/components/schemas/Kind"
        customer:
          "$ref": "#/components/schemas/CustomerOrNone"
        state:
          type: string
          description: Deleted projects are not listed.
          enum:
            - active
            - closed
        created:
          type: string
          description: The day the project was created.
          format: date
        goal:
          type: string
          description: "The goal line of SCOPE.md after the data check. A withheld part reads [withheld]; a goal the check still refuses reads [Content withheld by the data check.]"
        goal_redacted:
          type: boolean
          description: true when the data check withheld a part of the goal.
        open_items:
          type:
            - integer
            - "null"
          description: "Lines of OPEN.md that start with a dash; null when OPEN.md cannot be read."
        live_resources:
          type:
            - integer
            - "null"
          description: "Rows of RESOURCES.md whose state is neither deleted nor kept; null when RESOURCES.md cannot be read."
        updated:
          type:
            - string
            - "null"
          description: "The latest change of SCOPE.md, STATE.md, OPEN.md or RESOURCES.md; null when none can be read."
          format: date-time
        status:
          "$ref": "#/components/schemas/ProjectStatus"
      required:
        - code
        - kind
        - customer
        - state
        - created
        - goal
        - goal_redacted
        - open_items
        - live_resources
        - updated
        - status
    ProjectList:
      type: object
      properties:
        source:
          type: string
          enum:
            - AWB project register
        fetched_at:
          type: string
          format: date-time
        projects:
          type: array
          description: Latest change first.
          items:
            "$ref": "#/components/schemas/ProjectSummary"
      required:
        - source
        - fetched_at
        - projects
    ProjectDocument:
      type: object
      properties:
        text:
          type: string
          description: "The file after the data check; empty when it is missing or cannot be read."
        status:
          type: string
          enum:
            - available
            - missing
            - unavailable
        redacted:
          type: boolean
          description: true when the data check withheld a part.
        modified:
          type:
            - string
            - "null"
          format: date-time
      required:
        - text
        - status
        - redacted
        - modified
    Deliverables:
      type: object
      properties:
        status:
          type: string
          description: unavailable when the folders cannot be read safely.
          enum:
            - available
            - unavailable
        items:
          type: array
