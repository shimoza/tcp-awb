# Template of the web side (seal/web/README.md), rendered by install.sh to
# /etc/systemd/system/cloudflared.service.d/50-awb-fence.conf. Not a unit of the deploy: install.sh restarts the
# tunnel when this file or the fence changed.
# cloudflared runs as its own system user (D-FRONT, RT-09). Root loads the nftables fence first (the + prefix):
# that user opens no loopback TCP connection, so an ingress changed in the dashboard reaches nothing but the
# sockets it may open, the front socket. Root also copies the tunnel's token (root 600 where it is) into the
# service's own runtime folder (0700, gone when it stops). The metrics listener is pinned to one port that the fence
# keeps every other user off.
[Service]
User=@CLOUDFLARED_USER@
Group=@CLOUDFLARED_USER@
RuntimeDirectory=cloudflared-awb
RuntimeDirectoryMode=0700
ExecStartPre=+/usr/sbin/nft -f /etc/awb/tunnel-fence.nft
ExecStartPre=+/usr/bin/install -m 0400 -o @CLOUDFLARED_USER@ -g @CLOUDFLARED_USER@ /etc/cloudflared/token /run/cloudflared-awb/tunnel
ExecStart=
ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel --metrics 127.0.0.1:20241 run --token-file /run/cloudflared-awb/tunnel
NoNewPrivileges=yes
PrivateTmp=yes
