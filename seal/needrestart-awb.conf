# Written by seal/setup.sh into /etc/needrestart/conf.d/awb.conf.
# The vault daemon and the key service hold the passphrase and the keys in memory only. A restart after a package
# upgrade (unattended-upgrades runs needrestart) leaves them locked, and the console shows no project and no chat.
# needrestart lists them and leaves them running; restart them by hand when it suits, then run awb vault unlock
# and awb keys unlock.
$nrconf{override_rc}{qr(^awb-vaultd\b)} = 0;
$nrconf{override_rc}{qr(^awb-keyd\b)} = 0;
