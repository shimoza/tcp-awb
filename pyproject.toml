[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-awb"
version = "0.1.0"
description = "Architect Workbench: intake, projects, checked knowledge and checked results for a cloud solution architect"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "shimoza"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "python-docx", "openpyxl", "reportlab"]

[project.scripts]
awb = "awb.cli:main"

[tool.setuptools.packages.find]
include = ["awb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# a hang fails the test after two minutes instead of waiting for hours (2026-10-09); a longer limit is set on the
# test itself, with the reason
timeout = 120
