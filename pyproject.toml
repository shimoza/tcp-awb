[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-awb"
version = "0.1.0"
description = "Architect Workbench: intake, projects, checked knowledge and checked results for a cloud solution architect"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "shimoza"}]
dependencies = []

[project.scripts]
awb = "awb.cli:main"

[tool.setuptools.packages.find]
include = ["awb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
